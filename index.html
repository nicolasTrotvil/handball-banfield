 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progresión de Fundamentos — West + CA Banfield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@300;400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde:    #0B6B3A;
      --dorado:   #A6874F;
      --tinta:    #1A1A1A;
      --gris:     #767671;
      --fondo:    #F3F6F1;
      --white:    #FFFFFF;
      --border:   #D5DAD3;
      --l1c:      #0B6B3A;
      --l1b:      #E4F0EA;
      --l2c:      #A6874F;
      --l2b:      #F4EDE1;
      --shadow:   0 1px 3px rgba(26,26,26,0.07);
      --r:        3px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-weight: 300;
      background: var(--fondo);
      color: var(--tinta);
      font-size: 15px;
    }

    /* ── HEADER ─────────────────────────────────────── */
    .hdr {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .hdr-trazo {
      flex-basis: 100%;
      height: 2px;
      background: linear-gradient(to right, var(--verde), transparent 55%);
      margin-top: 10px;
    }
    .hdr-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cab-seal {
      width: 26px;
      height: 26px;
      background: var(--dorado);
      color: #fff;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 7px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      letter-spacing: 0.08em;
      flex-shrink: 0;
      user-select: none;
    }
    .hdr-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 17px;
      font-weight: 400;
      color: var(--tinta);
    }
    .hdr-sub {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 10px;
      color: var(--gris);
      letter-spacing: 0.06em;
      margin-top: 2px;
    }
    .hdr-btns { display: flex; gap: 7px; flex-wrap: wrap; }

    /* ── BUTTONS ────────────────────────────────────── */
    .btn {
      padding: 6px 14px;
      border-radius: var(--r);
      border: 1px solid var(--border);
      cursor: pointer;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      transition: background .15s, color .15s, border-color .15s;
      white-space: nowrap;
      background: transparent;
      color: var(--gris);
    }
    .btn-ghost { border-color: var(--border); color: var(--gris); }
    .btn-ghost:hover { border-color: var(--tinta); background: var(--tinta); color: var(--white); }
    .btn-outline { border-color: var(--border); color: var(--gris); background: var(--white); }
    .btn-outline:hover { border-color: var(--tinta); background: var(--tinta); color: var(--white); }
    .btn-primary { background: var(--verde); color: #fff; border-color: var(--verde); }
    .btn-primary:hover { background: #085530; border-color: #085530; }
    .btn-danger  { border-color: #c0392b; color: #c0392b; background: transparent; }
    .btn-danger:hover { background: #c0392b; color: #fff; }
    .btn-reset { border-color: var(--border); color: var(--gris); }
    .btn-reset:hover { border-color: #c0392b; color: #c0392b; }

    /* ── SYSTEM BAR ─────────────────────────────────── */
    .sys-bar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .sys-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--gris);
      text-transform: uppercase;
      letter-spacing: 0.10em;
      white-space: nowrap;
    }
    .sys-opts { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-sys {
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      cursor: pointer;
      transition: all .15s;
      color: var(--gris);
    }
    .btn-sys.on { border-color: var(--verde); background: var(--verde); color: #fff; }
    .btn-sys:hover:not(.on) { border-color: var(--tinta); color: var(--tinta); }
    .custom-lvls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .custom-lvls label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--gris);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .custom-lvls input {
      width: 80px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      background: var(--white);
      color: var(--tinta);
    }
    .custom-lvls input:focus { outline: none; border-color: var(--verde); }

    /* ── TABS ───────────────────────────────────────── */
    .tabs-wrap {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tabs-wrap::-webkit-scrollbar { height: 3px; }
    .tabs-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .tabs { display: flex; padding: 0 20px; min-width: max-content; }
    .tab {
      padding: 11px 14px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gris);
      white-space: nowrap;
      transition: all .15s;
      user-select: none;
    }
    .tab:hover { color: var(--tinta); }
    .tab.on { color: var(--verde); border-bottom-color: var(--verde); }
    .tab-badge {
      display: inline-block;
      margin-left: 5px;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 10px;
      background: var(--fondo);
      color: var(--gris);
    }
    .tab.on .tab-badge { background: var(--l1b); color: var(--verde); }

    /* ── MAIN ───────────────────────────────────────── */
    .main { max-width: 820px; margin: 0 auto; padding: 24px 16px 100px; }

    /* ── CAT HEADER ─────────────────────────────────── */
    .cat-hdr {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .cat-ctx {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--gris);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 5px;
    }
    .cat-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 26px;
      font-weight: 400;
      color: var(--tinta);
      line-height: 1.1;
    }
    .cat-title span { font-size: 16px; color: var(--gris); font-weight: 300; }
    .cat-meta {
      font-size: 13px;
      color: var(--gris);
      margin-top: 4px;
      font-weight: 300;
    }
    .cat-trazo {
      width: 48px;
      height: 2px;
      background: linear-gradient(to right, var(--verde), transparent);
      margin-top: 10px;
    }
    .cat-acts { display: flex; gap: 7px; align-items: flex-start; }

    /* ── LEGEND ─────────────────────────────────────── */
    .legend {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .leg-ctx {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--gris);
      text-transform: uppercase;
      letter-spacing: 0.10em;
      margin-right: 2px;
    }
    .leg-item { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--gris); }
    .leg-dot {
      width: 26px;
      height: 26px;
      border-radius: var(--r);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 400;
    }

    /* ── CAT NOTE ───────────────────────────────────── */
    .cat-note {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .cat-note-hdr {
      padding: 10px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--gris);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .cat-note-hdr:hover { background: var(--fondo); }
    .cat-note-body { display: none; border-top: 1px solid var(--border); }
    .cat-note-body textarea {
      width: 100%;
      padding: 10px 14px;
      border: none;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      resize: vertical;
      min-height: 80px;
      background: var(--fondo);
      outline: none;
      color: var(--tinta);
    }

    /* ── GROUP ──────────────────────────────────────── */
    .group {
      margin-bottom: 14px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
    }
    .group-hdr {
      padding: 10px 16px;
      background: var(--fondo);
      border-bottom: 1px solid var(--border);
      border-left: 2px solid var(--verde);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 400;
      color: var(--gris);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* ── FUND ITEM ──────────────────────────────────── */
    .fund-item { border-bottom: 1px solid var(--border); }
    .fund-item:last-child { border-bottom: none; }
    .fund-item.drag-over > .fund-row { box-shadow: 0 -2px 0 var(--verde) inset; }
    .fund-item.dragging { opacity: .3; }

    .fund-row {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 10px;
      cursor: grab;
      transition: background .1s;
    }
    .fund-row:hover { background: var(--fondo); }

    .drag-hdl {
      color: var(--border);
      font-size: 16px;
      cursor: grab;
      user-select: none;
      flex-shrink: 0;
      line-height: 1;
    }
    .fund-name { flex: 1; font-size: 14px; font-weight: 300; }

    /* ── LEVEL BUTTONS ──────────────────────────────── */
    .lvl-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .btn-lvl {
      min-width: 38px;
      height: 32px;
      padding: 0 8px;
      border-radius: var(--r);
      border: 1px solid var(--border);
      background: transparent;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      cursor: pointer;
      transition: all .15s;
      color: var(--gris);
      white-space: nowrap;
    }
    .btn-lvl:hover { border-color: var(--gris); color: var(--tinta); }
    .btn-lvl.l1 { background: var(--l1b); border-color: var(--l1c); color: var(--l1c); }
    .btn-lvl.l2 { background: var(--l2b); border-color: var(--l2c); color: var(--l2c); }
    .btn-lvl.l3 { background: var(--verde); border-color: var(--verde); color: #fff; }

    /* ── NOTE ───────────────────────────────────────── */
    .note-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: var(--r);
      opacity: .25;
      transition: opacity .15s;
      flex-shrink: 0;
      line-height: 1;
      color: var(--tinta);
    }
    .note-btn:hover { opacity: .6; }
    .note-btn.filled { opacity: 1; color: var(--verde); }

    .note-area {
      display: none;
      padding: 8px 14px 12px 44px;
      background: var(--fondo);
      border-top: 1px solid var(--border);
    }
    .note-area.open { display: block; }
    .note-area textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      resize: vertical;
      min-height: 58px;
      outline: none;
      color: var(--tinta);
      background: var(--white);
    }
    .note-area textarea:focus { border-color: var(--verde); }

    /* ── BOTTOM BAR ─────────────────────────────────── */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--white);
      border-top: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
      box-shadow: 0 -2px 12px rgba(26,26,26,.05);
      z-index: 40;
    }

    /* ── MODAL ──────────────────────────────────────── */
    .modal-bg {
      display: none;
      position: fixed; inset: 0;
      background: rgba(26,26,26,.4);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--white);
      border-radius: var(--r);
      padding: 28px;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(26,26,26,.18);
    }
    .modal-ctx {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--gris);
      text-transform: uppercase;
      letter-spacing: 0.10em;
      margin-bottom: 6px;
    }
    .modal h3 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 10px;
    }
    .modal p { font-size: 14px; color: var(--gris); margin-bottom: 24px; font-weight: 300; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }

    /* ── PRINT ──────────────────────────────────────── */
    @media print {
      .hdr, .sys-bar, .tabs-wrap, .bottom-bar, .drag-hdl,
      .note-btn, .lvl-btns, .cat-acts, .cat-note-hdr { display: none !important; }
      .note-area { display: block !important; }
      .cat-note-body { display: block !important; }
      body { background: white; }
      .main { max-width: 100%; padding: 0; }
      .group { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; }
      .fund-row { padding: 6px 10px; }
      .fund-name::after { content: attr(data-level); margin-left: 8px; font-weight: 700; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-brand">
    <div class="cab-seal">CAB</div>
    <div>
      <div class="hdr-title">Progresión de Fundamentos</div>
      <div class="hdr-sub">Westminster · CA Banfield · Trotvil / Ojea</div>
    </div>
  </div>
  <div class="hdr-btns">
    <button class="btn btn-ghost" onclick="exportAll('md')">Todo .md</button>
    <button class="btn btn-ghost" onclick="exportAll('txt')">Todo .txt</button>
    <button class="btn btn-ghost" onclick="window.print()">Imprimir</button>
    <button class="btn btn-reset" onclick="openReset()">Reiniciar</button>
  </div>
  <div class="hdr-trazo"></div>
</div>

<!-- SYSTEM BAR -->
<div class="sys-bar">
  <span class="sys-label">Sistema:</span>
  <div class="sys-opts">
    <button class="btn-sys on" id="sys-ecd" onclick="setSys('ecd')">E / C / D</button>
    <button class="btn-sys"    id="sys-caa" onclick="setSys('caa')">Cog / Aso / Aut</button>
    <button class="btn-sys"    id="sys-pta" onclick="setSys('pta')">P / T / A</button>
    <button class="btn-sys"    id="sys-custom" onclick="setSys('custom')">Personalizado</button>
  </div>
  <div class="custom-lvls" id="custom-inputs" style="display:none">
    <label>Nivel 1</label>
    <input id="cl1" placeholder="ej. Inicio" oninput="updateCustom()">
    <label>Nivel 2</label>
    <input id="cl2" placeholder="ej. Trabajo" oninput="updateCustom()">
    <label>Nivel 3</label>
    <input id="cl3" placeholder="ej. Dominio" oninput="updateCustom()">
  </div>
</div>

<!-- TABS -->
<div class="tabs-wrap">
  <div class="tabs" id="tabs"></div>
</div>

<!-- MAIN -->
<div class="main" id="main"></div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="btn btn-outline" onclick="exportCat('md')">Categoría .md</button>
  <button class="btn btn-outline" onclick="exportCat('txt')">Categoría .txt</button>
  <button class="btn btn-primary" onclick="window.print()">Imprimir / PDF</button>
</div>

<!-- RESET MODAL -->
<div class="modal-bg" id="modal-reset">
  <div class="modal">
    <div class="modal-ctx">Herramienta</div>
    <h3>¿Reiniciar todo?</h3>
    <p>Se borran todos los niveles asignados, notas y orden personalizado. Esta acción no se puede deshacer.</p>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger"  onclick="doReset()">Sí, reiniciar</button>
    </div>
  </div>
</div>

<script>
// ─── DATOS ─────────────────────────────────────────────────────────────────

  { id:'inf-12',    lab:'Infantil 2º',   age:'12',   stage:'Fundamentos'      },
  { id:'men-13',    lab:'Menor 1º',      age:'13',   stage:'Desarrollo'       },
  { id:'men-14',    lab:'Menor 2º',      age:'14',   stage:'Desarrollo'       },

const ALL_FUNDS = GROUPS.flatMap(g => g.funds);
const N_TOTAL   = ALL_FUNDS.length;

// ─── SISTEMAS ──────────────────────────────────────────────────────────────

const SYSMAP = {
  ecd:    { labs:['—','E','C','D'],       names:['Sin asignar','Explorar','Construir','Dominar']          },
  caa:    { labs:['—','Cog','Aso','Aut'], names:['Sin asignar','Cognitivo','Asociativo','Autónomo']       },
  pta:    { labs:['—','P','T','A'],       names:['Sin asignar','Presentar','Trabajar','Automatizar']      },
  custom: { labs:['—','N1','N2','N3'],    names:['Sin asignar','Nivel 1','Nivel 2','Nivel 3']             },
};

// ─── ESTADO ────────────────────────────────────────────────────────────────

const ST_KEY = 'hb-progresion-v3';

let st = {
  sys:     'ecd',
  cat:     'pre-mini',
  assign:  {},   // `${catId}|${fundId}` → 0-3
  notes:   {},   // `${catId}|${fundId}` → string
  catNote: {},   // catId → string
  order:   {},   // `${catId}|${groupId}` → [fundId,...]
};

function load() {
  try { const s = localStorage.getItem(ST_KEY); if(s) Object.assign(st, JSON.parse(s)); } catch(e){}
}
function save() {
  localStorage.setItem(ST_KEY, JSON.stringify(st));
}

// ─── ACCESORES ─────────────────────────────────────────────────────────────

function lv(cid, fid)       { return st.assign[`${cid}|${fid}`] || 0; }
function setLv(cid,fid,n)   { st.assign[`${cid}|${fid}`] = n; save(); }
function note(cid,fid)      { return st.notes[`${cid}|${fid}`] || ''; }
function setNote(cid,fid,v) { st.notes[`${cid}|${fid}`] = v; save(); }
function catN(cid)          { return st.catNote[cid] || ''; }
function setCatN(cid,v)     { st.catNote[cid] = v; save(); }

function order(cid, g) {
  const k = `${cid}|${g.id}`;
  if (!st.order[k]) st.order[k] = g.funds.map(f => f.id);
  return st.order[k];
}
function setOrder(cid, gid, ids) { st.order[`${cid}|${gid}`] = ids; save(); }

function progress(cid) { return ALL_FUNDS.filter(f => lv(cid,f.id) > 0).length; }

function sys()  { return SYSMAP[st.sys]; }
function lab(n) { return sys().labs[n]; }

// ─── SISTEMA ───────────────────────────────────────────────────────────────

function setSys(s) {
  st.sys = s;
  save();
  document.querySelectorAll('.btn-sys').forEach(b => b.classList.remove('on'));
  document.getElementById(`sys-${s}`).classList.add('on');
  document.getElementById('custom-inputs').style.display = s==='custom' ? 'flex' : 'none';
  renderMain(); renderTabs();
}

function updateCustom() {
  const v1 = document.getElementById('cl1').value.trim() || 'N1';
  const v2 = document.getElementById('cl2').value.trim() || 'N2';
  const v3 = document.getElementById('cl3').value.trim() || 'N3';
  SYSMAP.custom.labs  = ['—', v1, v2, v3];
  SYSMAP.custom.names = ['Sin asignar', v1, v2, v3];
  renderMain();
}

// ─── TABS ──────────────────────────────────────────────────────────────────

function renderTabs() {
  document.getElementById('tabs').innerHTML = CATS.map(c => {
    const p = progress(c.id);
    return `<div class="tab ${c.id===st.cat?'on':''}" onclick="switchCat('${c.id}')">
      ${c.lab}${p>0?`<span class="tab-badge">${p}</span>`:''}
    </div>`;
  }).join('');
}

function switchCat(cid) {
  st.cat = cid; save();
  renderTabs(); renderMain();
}

// ─── MAIN ──────────────────────────────────────────────────────────────────

const NOTE_SVG = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2L12 4.5 4.5 12H2v-2.5L9.5 2z"/></svg>`;

const DOT_STYLES = [
  'background:#E4F0EA;color:#0B6B3A;border:1px solid #0B6B3A',
  'background:#F4EDE1;color:#A6874F;border:1px solid #A6874F',
  'background:#0B6B3A;color:#fff',
];

function renderMain() {
  const cat  = CATS.find(c => c.id === st.cat);
  const s    = sys();

  const legend = s.labs.slice(1).map((l,i) =>
    `<div class="leg-item">
      <div class="leg-dot" style="${DOT_STYLES[i]}">${l}</div>
      <span>${s.names[i+1]}</span>
    </div>`
  ).join('');

  const cn   = catN(cat.id);
  const groups = GROUPS.map(g => {
    const ids  = order(cat.id, g);
    const rows = ids.map(fid => {
      const f    = g.funds.find(f => f.id === fid);
      if(!f) return '';
      const lvl  = lv(cat.id, f.id);
      const nt   = note(cat.id, f.id);

      const lvlBtns = [1,2,3].map(n => {
        const cls = lvl===n ? `btn-lvl l${n}` : 'btn-lvl';
        return `<button class="${cls}"
          onclick="toggleLv('${cat.id}','${f.id}',${n})"
          title="${s.names[n]}">${s.labs[n]}</button>`;
      }).join('');

      return `<div class="fund-item" id="fi-${cat.id}-${f.id}"
          draggable="true"
          ondragstart="dStart(event,'${cat.id}','${g.id}','${f.id}')"
          ondragover="dOver(event,'${cat.id}','${g.id}','${f.id}')"
          ondragleave="dLeave(event,'${cat.id}','${g.id}','${f.id}')"
          ondrop="dDrop(event,'${cat.id}','${g.id}','${f.id}')">
        <div class="fund-row">
          <span class="drag-hdl" title="Arrastrar para reordenar">⠿</span>
          <span class="fund-name" data-level="${lvl>0?lab(lvl):''}">${f.lab}</span>
          <div class="lvl-btns">${lvlBtns}</div>
          <button class="note-btn ${nt?'filled':''}" id="nb-${cat.id}-${f.id}"
            onclick="toggleNote('${cat.id}','${f.id}')" title="Agregar nota">${NOTE_SVG}</button>
        </div>
        <div class="note-area ${nt?'open':''}" id="na-${cat.id}-${f.id}">
          <textarea placeholder="Nota sobre ${f.lab} en ${cat.lab}..."
            onchange="setNote('${cat.id}','${f.id}',this.value)"
            onkeyup="onNoteKey('${cat.id}','${f.id}',this.value)">${esc(nt)}</textarea>
        </div>
      </div>`;
    }).join('');

    return `<div class="group">
      <div class="group-hdr">${g.lab}</div>
      <div id="grp-${cat.id}-${g.id}">${rows}</div>
    </div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="cat-hdr">
      <div>
        <div class="cat-ctx">Categoría</div>
        <div class="cat-title">${cat.lab} <span>· ${cat.age} años</span></div>
        <div class="cat-meta">Etapa: ${cat.stage} · ${progress(cat.id)} de ${N_TOTAL} fundamentos asignados</div>
        <div class="cat-trazo"></div>
      </div>
      <div class="cat-acts">
        <button class="btn btn-outline" onclick="exportCat('md')">Exportar .md</button>
        <button class="btn btn-outline" onclick="exportCat('txt')">Exportar .txt</button>
      </div>
    </div>

    <div class="legend">
      <span class="leg-ctx">Niveles:</span>
      ${legend}
    </div>

    <div class="cat-note">
      <div class="cat-note-hdr" onclick="toggleCatNote('${cat.id}')">
        <span>Nota general de la categoría</span>
        <span id="cn-arr-${cat.id}">${cn?'▲':'▼'}</span>
      </div>
      <div class="cat-note-body" id="cn-body-${cat.id}" style="display:${cn?'block':'none'}">
        <textarea placeholder="Acuerdos, contexto, decisiones generales para ${cat.lab}..."
          onchange="setCatN('${cat.id}',this.value)">${esc(cn)}</textarea>
      </div>
    </div>

    ${groups}
  `;
}

function esc(s) { return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleCatNote(cid) {
  const body = document.getElementById(`cn-body-${cid}`);
  const arr  = document.getElementById(`cn-arr-${cid}`);
  const open = body.style.display === 'none';
  body.style.display = open ? 'block' : 'none';
  arr.textContent    = open ? '▲' : '▼';
}

function toggleLv(cid, fid, n) {
  const cur = lv(cid, fid);
  setLv(cid, fid, cur===n ? 0 : n);
  renderMain(); renderTabs();
}

function toggleNote(cid, fid) {
  const na = document.getElementById(`na-${cid}-${fid}`);
  na.classList.toggle('open');
}

function onNoteKey(cid, fid, val) {
  setNote(cid, fid, val);
  const btn = document.getElementById(`nb-${cid}-${fid}`);
  if(btn) btn.classList.toggle('filled', val.length > 0);
}

// ─── DRAG & DROP ───────────────────────────────────────────────────────────

let drag = null;

function dStart(e, cid, gid, fid) {
  drag = { cid, gid, fid };
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function dOver(e, cid, gid, fid) {
  e.preventDefault();
  if(!drag || drag.gid!==gid || drag.fid===fid) return;
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function dLeave(e, cid, gid, fid) {
  e.currentTarget.classList.remove('drag-over');
}
function dDrop(e, cid, gid, fid) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(!drag || drag.gid!==gid || drag.fid===fid) { drag=null; return; }
  const g    = GROUPS.find(g => g.id===gid);
  const ids  = [...order(cid, g)];
  const fi   = ids.indexOf(drag.fid);
  const ti   = ids.indexOf(fid);
  if(fi<0||ti<0) { drag=null; return; }
  ids.splice(fi,1);
  ids.splice(ti,0,drag.fid);
  setOrder(cid, gid, ids);
  drag = null;
  renderMain();
}

// ─── EXPORT ────────────────────────────────────────────────────────────────

function buildMd(catIds) {
  const s    = sys();
  const date = new Date().toLocaleDateString('es-AR');
  let out = `# Progresión de Fundamentos — Westminster + CA Banfield\n`;
  out    += `**Autores:** Nicolás Trotvil / Juan Francisco Ojea  \n`;
  out    += `**Sistema:** ${s.names.slice(1).join(' / ')}  \n`;
  out    += `**Fecha:** ${date}\n\n---\n\n`;

  for(const cid of catIds){
    const cat = CATS.find(c=>c.id===cid);
    const cn  = catN(cid);
    out += `## ${cat.lab} · ${cat.age} años · *${cat.stage}*\n\n`;
    if(cn) out += `> ${cn.replace(/\n/g,'\n> ')}\n\n`;

    for(const g of GROUPS){
      const ids  = order(cid, g);
      const rows = ids.map(fid=>{
        const f  = g.funds.find(f=>f.id===fid); if(!f) return '';
        const n  = lv(cid,f.id);
        const nt = note(cid,f.id).replace(/\n/g,' ');
        return `| ${f.lab} | ${n>0?lab(n):'—'} | ${nt} |`;
      }).filter(Boolean).join('\n');

      out += `### ${g.lab}\n\n| Fundamento | Nivel | Nota |\n|---|:---:|---|\n${rows}\n\n`;
    }
    out += '---\n\n';
  }
  return out;
}

function buildTxt(catIds) {
  const s    = sys();
  const date = new Date().toLocaleDateString('es-AR');
  let out  = 'PROGRESIÓN DE FUNDAMENTOS — WESTMINSTER + CA BANFIELD\n';
  out     += `Autores: Nicolás Trotvil / Juan Francisco Ojea\n`;
  out     += `Sistema: ${s.names.slice(1).join(' / ')}\n`;
  out     += `Fecha: ${date}\n${'='.repeat(60)}\n\n`;

  for(const cid of catIds){
    const cat = CATS.find(c=>c.id===cid);
    const cn  = catN(cid);
    out += `${cat.lab.toUpperCase()} · ${cat.age} AÑOS · ${cat.stage.toUpperCase()}\n${'-'.repeat(50)}\n`;
    if(cn) out += `Nota: ${cn}\n`;
    out += '\n';

    for(const g of GROUPS){
      out += `${g.lab}:\n`;
      const ids = order(cid, g);
      for(const fid of ids){
        const f  = g.funds.find(f=>f.id===fid); if(!f) continue;
        const n  = lv(cid,f.id);
        const nt = note(cid,f.id);
        out += `  [${n>0?lab(n):'—'}] ${f.lab}`;
        if(nt) out += `\n       → ${nt}`;
        out += '\n';
      }
      out += '\n';
    }
    out += '='.repeat(60)+'\n\n';
  }
  return out;
}

function dl(content, name) {
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));
  a.download = name;
  a.click();
}

function exportCat(fmt) {
  const cat  = CATS.find(c=>c.id===st.cat);
  const date = new Date().toISOString().slice(0,10);
  dl(fmt==='md'?buildMd([st.cat]):buildTxt([st.cat]), `progresion-${cat.id}-${date}.${fmt}`);
}

function exportAll(fmt) {
  const date = new Date().toISOString().slice(0,10);
  dl(fmt==='md'?buildMd(CATS.map(c=>c.id)):buildTxt(CATS.map(c=>c.id)), `progresion-completa-${date}.${fmt}`);
}

function doReset() {
  closeModal();
  st.assign = {}; st.notes = {}; st.catNote = {}; st.order = {};
  save(); renderTabs(); renderMain();
}
